name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: cbr_test
          POSTGRES_PASSWORD: cbr_test
          POSTGRES_DB: cbr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cbr_test -d cbr_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:8.2.10-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      FLASK_SECRET_KEY: ci-test-only-secret
      TEST_DATABASE_URL: postgresql://cbr_test:cbr_test@127.0.0.1:5432/cbr_test

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check production debug mode
        env:
          FLASK_DEBUG: "0"
        run: |
          python - <<'PY'
          from backend.app import app

          assert not app.debug, "Debug mode must be disabled in production"
          PY

      - name: Prepare country data for tests
        # The country cache is gitignored. Seed it so tests need no API access.
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          countries = [
              {
                  "names": {"common": "Japan"},
                  "population": 125_000_000,
                  "area": {"kilometers": 377_975},
                  "flag": {"emoji": "JP"},
              },
              {
                  "names": {"common": "Germany"},
                  "population": 83_000_000,
                  "area": {"kilometers": 357_022},
                  "flag": {"emoji": "DE"},
              },
          ]
          Path("countries.json").write_text(
              json.dumps({"timestamp": time.time(), "countries": countries}),
              encoding="utf-8",
          )
          PY

      - name: Run tests
        run: python -m unittest discover -v
