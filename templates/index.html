{% import '_components.html' as ui with context %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f2ed">
    <meta name="description" content="Two countries. One call. Compare population and area, choose the winner, and build your streak in Country Battle Royale.">
    <title>Country Battle Royale</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link rel="preload" href="{{ url_for('static', filename='fonts/arena-condensed.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ url_for('static', filename='fonts/arena-sans.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='auth.js') }}" defer></script>
    <script src="{{ url_for('static', filename='game.js') }}" defer></script>
</head>
<body>
    <a class="skip-link" href="#arena">Skip to the game</a>
    {{ ui.header() }}
    <main class="game-main page-width">
        {% include '_arena.html' %}
    </main>
    <footer class="site-footer page-width">
        <span>Country Battle Royale</span><span>v0.1.0 · Public Beta</span>
    </footer>
    {% include '_auth-dialogs.html' %}
</body>
</html>
