<!Doctype html>
<head>
    <meta charset="UTF-8" lang="en">
    <title>Country Battle-Royale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <H1>Welcome to CBR! (Country Battle-Royale)</H1>
    <form method="post">
        <p>Enter country #1</p>
        <input type="text" name="country1" required>
        <p>Enter country #2</p>
        <input type="text" name="country2" required>
        <p></p>
        <button>FIGHT</button>
    </form>
    Outcome: {% for country, stats in data.items() %}
        <div class="country-card">
            {{ stats["Flag"] }} {{ country }} - {{ stats["Points"] }} points
            <p>Population: {{ stats["Population"] }}</p>
            <p>Area(km²): {{ stats["Area(km)"] }}</p>
        </div>
    {% endfor %}
</body>
